name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        id: build
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nevino2333 --branch=master

      - name: Notify admin deployment callback
        if: ${{ always() }}
        env:
          CALLBACK_URL: ${{ secrets.DEPLOYMENT_CALLBACK_URL }}
          CALLBACK_SECRET: ${{ secrets.DEPLOYMENT_CALLBACK_SECRET }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success) OUTCOME="success" ;;
            *) OUTCOME="failure" ;;
          esac
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            -o /tmp/callback-body.txt -w "%{http_code}" \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Deployment-Callback-Secret: $CALLBACK_SECRET" \
            --data "{\"commitSha\":\"$COMMIT_SHA\",\"outcome\":\"$OUTCOME\"}")
          echo "callback status: $HTTP_CODE body: $(cat /tmp/callback-body.txt)"
          # 404 表示本次部署没有等待回调的发布任务（普通内容推送），视为正常
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "404" ]; then
            exit 0
          fi
          exit 1